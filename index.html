<!DOCTYPE html>
<html lang="en">
    <!-- This is a comment  can be used by ( pressing ctrl+/ )-->
<head>
   
    <title>HTML TAGS</title> 

</head>
<body>

    <!-- h1 heading one not used to increase the text size -->
    <h1>My HTML Page</h1>

    <!-- <hr> used to create a horizontal rule -->
    <hr>

    <h2>Text Formatting</h2>

    <!-- paragraph -->
    <p>This is a paragraph.</p>

    <!-- br tag used to goto next line -->
     <br>

    <!-- bold -->
    <b>This is bold text.</b>
    <br>

    <!-- italic -->
    <i>This is italic text.</i>
    <br>

    <!-- underlined -->
    <u>This is underlined text.</u>
    <br>

    <!-- small text -->
    <small>This is small text.</small>
    <br>

    <!-- big text -->
    <big>big tag shows big text</big>
    <br>

    <!-- small tag showssmall text -->
    <small>this is a small text</small>
    <br>
    <hr>


    <!-- ANCHOR TAG -->
    <!-- absolute link -->
    <a href="https://www.google.com">Visit Google</a><br>
    <!-- relative link  -->
    <a href="about.html">About Us</a>
    <hr>


    <!-- IMAGE TAG -->
    <!-- absolute link -->
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT7P9NiruM4qUZmpH-Hnyl31gDc2mts429qxU2IkTBWJg&s=10" alt="Sample Image"><br>
     <!-- relative link -->
    <img src="image.jpg" alt="Sample Image"><br>
    <img src ="image.jpg" alt="Sample Image" width="200" height="200"><br><hr>

    <!-- subscript -->
    <p>H<sub>2</sub>O</p>
    <!-- superscript -->
    <p>E=mc<sup>2</sup></p><hr>

    <!-- LIST TAGS -->
    <h2>Unordered List</h2>
    <ul>
        <li>Item 1</li>
        <li>Item 2</li>
        <li>Item 3</li>
    </ul>

</body>
</html>
